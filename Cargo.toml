[package]
name = "retree"
version = "0.7.1"
edition = "2021"
rust-version = "1.80"
description = "Fast, cross-platform GNU tree compatible directory listing"
license = "MIT"
repository = "https://github.com/M4dPac/retree"
keywords = ["tree", "directory", "cli", "windows", "gnu-tree"]
categories = ["command-line-utilities", "filesystem"]
authors = ["M4dPac"]
include = [
  "src/**/*",
  "benches/**/*.rs",
  "tests/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "README.ru.md",
  "LICENSE",
  "CHANGELOG.md",
]

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "unicode", "string"] }
clap_complete = "4"
unicode-width = "0.2"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = { version = "0.41", features = ["serialize"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
] }
rustc-hash = "2"
rayon = "1"
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
uzers = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_SystemServices",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = "0.8"
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

[features]
tree_compat = []

[[bin]]
name = "rt"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "retree_perf"
harness = false

[[bench]]
name = "retree_perf_xlarge"
harness = false
